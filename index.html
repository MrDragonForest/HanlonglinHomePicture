<!doctype html>
<html lang="zh-CN" data-theme="warm">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="我们的小日子 — 生活照片集" />
    <meta name="theme-color" content="#FBF7F1" />
    <title>我们的小日子</title>

    <!-- 内联 SVG 图标：不额外发请求，也不会因为部署子路径而 404 -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23C4643C'/%3E%3Ccircle cx='16' cy='16' r='7.5' fill='none' stroke='%23FBF7F1' stroke-width='1.6'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23FBF7F1'/%3E%3C/svg%3E"
    />

    <!--
      字体自托管（见 src/styles/fonts.css）。这里刻意不引外链样式表：
      fonts.googleapis.com 是渲染阻塞资源，不可达时整页白屏。
    -->

    <script>
      // 在首帧之前套用主题，避免深色主题下出现白色闪屏
      (function () {
        try {
          var t = localStorage.getItem('gallery:theme')
          if (t === 'night' || t === 'warm') {
            document.documentElement.dataset.theme = t
            if (t === 'night') {
              document
                .querySelector('meta[name="theme-color"]')
                .setAttribute('content', '#14100E')
            }
          }
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
